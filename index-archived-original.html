<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bro Liquidity | Finance Talk, Trades & Career Moves</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, .35), transparent 35%),
        radial-gradient(circle at top right, rgba(163, 255, 18, .25), transparent 30%),
        #050816;
      color: white;
    }
    .glass {
      background: rgba(8, 13, 35, 0.78);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .pop-card {
      transition: .25s ease;
    }
    .pop-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 45px rgba(182,255,34,.18);
      border-color: rgba(182,255,34,.65);
    }
    .logo-glow {
      filter: drop-shadow(0 0 32px rgba(182,255,34,.35));
    }
  </style>
</head>
<body>
  <header class="px-6 py-5">
    <nav class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="mainlogo.png" alt="Bro Liquidity Logo" class="w-14 h-14 rounded-2xl object-cover">
        <div>
          <h1 class="font-black text-xl tracking-tight">Bro Liquidity</h1>
          <p class="text-xs text-slate-400">Trades. Licenses. Careers.</p>
        </div>
      </div>
      <div class="hidden md:flex items-center gap-8 text-sm font-semibold text-slate-300">
        <a href="#features" class="hover:text-[#b6ff22]">Features</a>
        <a href="#community" class="hover:text-[#b6ff22]">Community</a>
        <a href="#user-flow" class="hover:text-[#b6ff22]">Get Started</a>
        <button id="nav-login-btn" class="ml-6 px-6 py-2 rounded-2xl bg-[#b6ff22] text-black font-black hover:scale-105 transition">Login</button>
      </div>
    </nav>
  </header>
  <!-- Add more sections here as needed for the landing page -->
</body>
</html>
